<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240" style="background: transparent; font-family: 'Space Grotesk', -apple-system, sans-serif;">
  <defs>
    <filter id="box-shadow" x="0" y="0" width="120%" height="120%">
      <feDropShadow dx="4" dy="4" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <linearGradient id="flow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8FF00" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#FFD600" />
    </linearGradient>
  </defs>

  <style>
    .pulse-travel {
      animation: travelPulse 3.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes travelPulse {
      0% { cx: 165; opacity: 1; }
      25% { cx: 320; opacity: 1; }
      50% { cx: 480; opacity: 1; }
      75% { cx: 640; opacity: 1; }
      100% { cx: 770; opacity: 0; }
    }
    .card-hover {
      transition: transform 0.2s ease;
    }
    .glow-lime {
      animation: limeGlow 2.5s ease-in-out infinite alternate;
    }
    @keyframes limeGlow {
      from { stroke: #B8FF00; }
      to { stroke: #00E5FF; }
    }
  </style>

  <!-- Frame Background -->
  <rect x="0" y="0" width="900" height="240" rx="10" fill="#0C0C10" stroke="#1F1F26" stroke-width="2" />
  
  <!-- Flow Connection Pipeline Line -->
  <line x1="120" y1="120" x2="780" y2="120" stroke="#22222A" stroke-width="6" stroke-dasharray="6 6" />
  <line x1="120" y1="120" x2="780" y2="120" stroke="url(#flow-line)" stroke-width="3" opacity="0.6" />

  <!-- Animated Traveling Light Particle -->
  <circle class="pulse-travel" cy="120" r="7" fill="#B8FF00" stroke="#000000" stroke-width="2">
    <animate attributeName="r" values="6;9;6" dur="1s" repeatCount="indefinite" />
  </circle>

  <!-- CARD 1: User Prompt -->
  <g transform="translate(30, 60)">
    <rect x="4" y="4" width="140" height="115" rx="6" fill="#000000" />
    <rect x="0" y="0" width="140" height="115" rx="6" fill="#F4F4F0" stroke="#000000" stroke-width="3" />
    <rect x="0" y="0" width="140" height="26" rx="6" fill="#B8FF00" stroke="#000000" stroke-width="2" />
    <rect x="0" y="20" width="140" height="6" fill="#B8FF00" />
    <text x="70" y="17" fill="#000000" font-size="10" font-weight="900" text-anchor="middle">1. NATURAL INPUT</text>
    <text x="70" y="55" font-size="24" text-anchor="middle">💬</text>
    <text x="70" y="76" fill="#000000" font-size="11" font-weight="800" text-anchor="middle">Plain English</text>
    <text x="70" y="94" fill="#555555" font-size="9" font-family="'Consolas', monospace" text-anchor="middle">Alt + Space Hotkey</text>
  </g>

  <!-- CARD 2: AI Compiler -->
  <g transform="translate(205, 60)">
    <rect x="4" y="4" width="140" height="115" rx="6" fill="#000000" />
    <rect x="0" y="0" width="140" height="115" rx="6" fill="#F4F4F0" stroke="#000000" stroke-width="3" />
    <rect x="0" y="0" width="140" height="26" rx="6" fill="#00E5FF" stroke="#000000" stroke-width="2" />
    <rect x="0" y="20" width="140" height="6" fill="#00E5FF" />
    <text x="70" y="17" fill="#000000" font-size="10" font-weight="900" text-anchor="middle">2. AI COMPILER</text>
    <text x="70" y="55" font-size="24" text-anchor="middle">🧠</text>
    <text x="70" y="76" fill="#000000" font-size="11" font-weight="800" text-anchor="middle">Ollama / Heuristics</text>
    <text x="70" y="94" fill="#555555" font-size="9" font-family="'Consolas', monospace" text-anchor="middle">Intent &amp; Plan Gen</text>
  </g>

  <!-- CARD 3: Safety Sandbox -->
  <g transform="translate(380, 60)">
    <rect x="4" y="4" width="140" height="115" rx="6" fill="#000000" />
    <rect x="0" y="0" width="140" height="115" rx="6" fill="#F4F4F0" stroke="#000000" stroke-width="3" />
    <rect x="0" y="0" width="140" height="26" rx="6" fill="#FFD600" stroke="#000000" stroke-width="2" />
    <rect x="0" y="20" width="140" height="6" fill="#FFD600" />
    <text x="70" y="17" fill="#000000" font-size="10" font-weight="900" text-anchor="middle">3. SAFETY SANDBOX</text>
    <text x="70" y="55" font-size="24" text-anchor="middle">🛡️</text>
    <text x="70" y="76" fill="#000000" font-size="11" font-weight="800" text-anchor="middle">Dry-Run Preview</text>
    <text x="70" y="94" fill="#555555" font-size="9" font-family="'Consolas', monospace" text-anchor="middle">Zero-Risk Isolation</text>
  </g>

  <!-- CARD 4: Silent Worker -->
  <g transform="translate(555, 60)">
    <rect x="4" y="4" width="140" height="115" rx="6" fill="#000000" />
    <rect x="0" y="0" width="140" height="115" rx="6" fill="#F4F4F0" stroke="#000000" stroke-width="3" />
    <rect x="0" y="0" width="140" height="26" rx="6" fill="#B8FF00" stroke="#000000" stroke-width="2" />
    <rect x="0" y="20" width="140" height="6" fill="#B8FF00" />
    <text x="70" y="17" fill="#000000" font-size="10" font-weight="900" text-anchor="middle">4. SILENT SIDECAR</text>
    <text x="70" y="55" font-size="24" text-anchor="middle">⚙️</text>
    <text x="70" y="76" fill="#000000" font-size="11" font-weight="800" text-anchor="middle">worker.exe</text>
    <text x="70" y="94" fill="#555555" font-size="9" font-family="'Consolas', monospace" text-anchor="middle">CREATE_NO_WINDOW</text>
  </g>

  <!-- CARD 5: Windows 11 Execution -->
  <g transform="translate(730, 60)">
    <rect x="4" y="4" width="140" height="115" rx="6" fill="#000000" />
    <rect x="0" y="0" width="140" height="115" rx="6" fill="#F4F4F0" stroke="#000000" stroke-width="3" />
    <rect x="0" y="0" width="140" height="26" rx="6" fill="#FF4D4D" stroke="#000000" stroke-width="2" />
    <rect x="0" y="20" width="140" height="6" fill="#FF4D4D" />
    <text x="70" y="17" fill="#FFFFFF" font-size="10" font-weight="900" text-anchor="middle">5. OS AUTOMATION</text>
    <text x="70" y="55" font-size="24" text-anchor="middle">💻</text>
    <text x="70" y="76" fill="#000000" font-size="11" font-weight="800" text-anchor="middle">Windows 11 Native</text>
    <text x="70" y="94" fill="#555555" font-size="9" font-family="'Consolas', monospace" text-anchor="middle">Files • Watchdogs • DB</text>
  </g>

  <!-- Title bar on top -->
  <text x="450" y="32" fill="#A0A0AB" font-size="12" font-family="'Consolas', monospace" font-weight="700" text-anchor="middle" letter-spacing="1.5">
    AUTOMATION PIPELINE &amp; SAFETY SANDBOX LIFECYCLE
  </text>
</svg>
