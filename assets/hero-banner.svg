<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="340" style="background: transparent; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Filter for Neo-Brutalist Hard Shadow -->
    <filter id="hard-shadow" x="0" y="0" width="120%" height="120%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#000000" flood-opacity="1" />
    </filter>
    <filter id="lime-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#222226" stroke-width="1.2" />
    </pattern>
    <linearGradient id="lime-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8FF00" />
      <stop offset="100%" stop-color="#8CE600" />
    </linearGradient>
    <linearGradient id="scanline" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B8FF00" stop-opacity="0" />
      <stop offset="50%" stop-color="#B8FF00" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#B8FF00" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .ghost-float {
      animation: floatAnim 3.5s ease-in-out infinite;
      transform-origin: center;
    }
    @keyframes floatAnim {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(-1.5deg); }
    }
    .pulse-dot {
      animation: pulseAnim 1.8s ease-in-out infinite;
    }
    @keyframes pulseAnim {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }
    .scan-beam {
      animation: scanAnim 4s linear infinite;
    }
    @keyframes scanAnim {
      0% { transform: translateY(-100px); }
      100% { transform: translateY(340px); }
    }
    .tagline-type {
      font-family: 'Space Grotesk', 'Consolas', 'Courier New', monospace;
      font-weight: 700;
    }
    .keycap-press {
      animation: keyPress 4s ease-in-out infinite;
    }
    @keyframes keyPress {
      0%, 85%, 100% { transform: translate(0, 0); }
      90%, 95% { transform: translate(2px, 2px); }
    }
  </style>

  <!-- Outer Hard Shadow Box -->
  <rect x="18" y="18" width="880" height="300" rx="8" fill="#B8FF00" />
  
  <!-- Main Container -->
  <rect x="12" y="12" width="880" height="300" rx="8" fill="#0E0E12" stroke="#000000" stroke-width="3.5" />
  
  <!-- Cyber Grid Pattern Background -->
  <rect x="15" y="15" width="874" height="294" rx="6" fill="url(#cyber-grid)" />

  <!-- Animated Scanline -->
  <g class="scan-beam">
    <rect x="15" y="0" width="874" height="60" fill="url(#scanline)" />
  </g>

  <!-- Window Header Bar -->
  <rect x="12" y="12" width="880" height="42" rx="8" fill="#18181D" stroke="#000000" stroke-width="3" />
  <rect x="12" y="44" width="880" height="10" fill="#18181D" /> <!-- Fill bottom radius -->
  <line x1="12" y1="54" x2="892" y2="54" stroke="#000000" stroke-width="3" />

  <!-- Window Controls -->
  <circle cx="36" cy="33" r="6.5" fill="#FF4D4D" stroke="#000000" stroke-width="2" />
  <circle cx="56" cy="33" r="6.5" fill="#FFD600" stroke="#000000" stroke-width="2" />
  <circle cx="76" cy="33" r="6.5" fill="#B8FF00" stroke="#000000" stroke-width="2" />

  <!-- Header Title -->
  <text x="104" y="38" fill="#A0A0AB" font-size="12" font-family="'Consolas', monospace" font-weight="700" letter-spacing="1.5">
    GHOSTPILOT // SYSTEM KERNEL v1.0.0 [WIN11 x64]
  </text>

  <!-- Live Status Beacon -->
  <g transform="translate(730, 24)">
    <rect x="0" y="0" width="145" height="20" rx="4" fill="#0A0A0C" stroke="#222" stroke-width="1.5" />
    <circle cx="12" cy="10" r="4" fill="#B8FF00" class="pulse-dot">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="14" fill="#B8FF00" font-size="10" font-family="'Consolas', monospace" font-weight="700" letter-spacing="0.5">STANDALONE: ACTIVE</text>
  </g>

  <!-- Left Side: Floating Neo-Brutalist Ghost Icon -->
  <g class="ghost-float" transform="translate(60, 95)">
    <!-- Ghost Hard Shadow -->
    <path d="M 60 14 C 28 14 10 38 10 75 L 10 135 L 25 120 L 42 135 L 60 120 L 78 135 L 95 120 L 110 135 L 110 75 C 110 38 92 14 60 14 Z" fill="#000000" transform="translate(6, 6)" />
    <!-- Ghost Body -->
    <path d="M 60 14 C 28 14 10 38 10 75 L 10 135 L 25 120 L 42 135 L 60 120 L 78 135 L 95 120 L 110 135 L 110 75 C 110 38 92 14 60 14 Z" fill="#F4F4F0" stroke="#000000" stroke-width="3.5" />
    <!-- Ghost Eyes (Glowing Cyber Visor / Neo-Brutalism square eyes) -->
    <rect x="34" y="55" width="16" height="18" rx="2" fill="#000000" />
    <rect x="37" y="58" width="10" height="12" rx="1" fill="#B8FF00">
      <animate attributeName="fill" values="#B8FF00;#00E5FF;#B8FF00" dur="4s" repeatCount="indefinite" />
    </rect>
    <rect x="70" y="55" width="16" height="18" rx="2" fill="#000000" />
    <rect x="73" y="58" width="10" height="12" rx="1" fill="#B8FF00">
      <animate attributeName="fill" values="#B8FF00;#00E5FF;#B8FF00" dur="4s" repeatCount="indefinite" />
    </rect>
    <!-- Cyber Headband / Tag -->
    <rect x="26" y="24" width="68" height="16" rx="3" fill="#B8FF00" stroke="#000000" stroke-width="2" />
    <text x="60" y="35" fill="#000000" font-size="8.5" font-family="'Consolas', monospace" font-weight="900" text-anchor="middle">AUTONOMOUS</text>
  </g>

  <!-- Right Side: Content Area -->
  <g transform="translate(225, 95)">
    <!-- Badge Pill -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="24" rx="4" fill="#B8FF00" stroke="#000000" stroke-width="2" />
      <text x="10" y="16" fill="#000000" font-size="11" font-family="'Segoe UI', sans-serif" font-weight="900" letter-spacing="1">
        ⚡ WINDOWS 11 AI COPILOT
      </text>
    </g>

    <!-- Main Title: GHOSTPILOT -->
    <text x="0" y="68" fill="#FFFFFF" font-size="46" font-family="'Space Grotesk', 'Impact', 'Segoe UI', sans-serif" font-weight="900" letter-spacing="2">
      GHOST<tspan fill="#B8FF00">PILOT</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="98" fill="#F4F4F0" font-size="17" font-family="'Segoe UI', sans-serif" font-weight="600">
      "Command your machine in plain English."
    </text>

    <!-- Animated Capabilities Line -->
    <g transform="translate(0, 118)">
      <rect x="0" y="0" width="640" height="34" rx="5" fill="#15151B" stroke="#000000" stroke-width="2" />
      <text x="14" y="22" fill="#00E5FF" font-size="12" font-family="'Consolas', monospace" font-weight="700">
        &gt; Auto-organize files • Purge temp cache • Batch rename • Watchdogs • Cron
      </text>
    </g>

    <!-- Keycap Action & Feature Badges -->
    <g transform="translate(0, 166)">
      <!-- Keycap Alt + Space -->
      <g class="keycap-press">
        <!-- Shadow -->
        <rect x="3" y="3" width="135" height="34" rx="5" fill="#000000" />
        <rect x="0" y="0" width="135" height="34" rx="5" fill="#F4F4F0" stroke="#000000" stroke-width="2.5" />
        <text x="67" y="22" fill="#000000" font-size="12" font-family="'Segoe UI', sans-serif" font-weight="900" text-anchor="middle">
          ⚡ Alt + Space
        </text>
      </g>

      <!-- Pill 1: Standalone -->
      <g transform="translate(150, 0)">
        <rect x="3" y="3" width="130" height="34" rx="5" fill="#000000" />
        <rect x="0" y="0" width="130" height="34" rx="5" fill="#FFD600" stroke="#000000" stroke-width="2.5" />
        <text x="65" y="22" fill="#000000" font-size="11.5" font-family="'Segoe UI', sans-serif" font-weight="900" text-anchor="middle">
          📦 100% Standalone
        </text>
      </g>

      <!-- Pill 2: Zero CMD Popups -->
      <g transform="translate(295, 0)">
        <rect x="3" y="3" width="145" height="34" rx="5" fill="#000000" />
        <rect x="0" y="0" width="145" height="34" rx="5" fill="#00E5FF" stroke="#000000" stroke-width="2.5" />
        <text x="72" y="22" fill="#000000" font-size="11.5" font-family="'Segoe UI', sans-serif" font-weight="900" text-anchor="middle">
          🚫 Silent No-Window
        </text>
      </g>

      <!-- Pill 3: Dry-Run Safe -->
      <g transform="translate(455, 0)">
        <rect x="3" y="3" width="135" height="34" rx="5" fill="#000000" />
        <rect x="0" y="0" width="135" height="34" rx="5" fill="#B8FF00" stroke="#000000" stroke-width="2.5" />
        <text x="67" y="22" fill="#000000" font-size="11.5" font-family="'Segoe UI', sans-serif" font-weight="900" text-anchor="middle">
          🛡️ Dry-Run Safe
        </text>
      </g>
    </g>
  </g>
</svg>
